name: WebUI_FE_CI

on:
  pull_request:
    branches: ["main", "develope"]
  push:
    branches: ["develope"]

permissions:
  contents: read

concurrency:
  group: webui-fe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        # Existing warning/info debt is reported without blocking the build.
        # New warnings should be removed as part of the corresponding change.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build web
        run: flutter build web

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag webui-fe:${{ github.sha }} .
