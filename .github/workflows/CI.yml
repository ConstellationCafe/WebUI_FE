name: WebUI_FE_CI

on:
  pull_request:
    branches: ["main", "develope"]
  push:
    branches: ["develope"]

permissions:
  contents: read

concurrency:
  group: webui-fe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate penalty providers and state
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format penalty source using CI Flutter
        run: dart format lib/feature/modules/erp/penalty test/feature/modules/erp/penalty

      - name: Export generated penalty code for source commit
        uses: actions/upload-artifact@v4
        with:
          name: penalty-generated-code
          path: |
            lib/feature/modules/erp/penalty/**/*.dart
            test/feature/modules/erp/penalty/**/*.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        # Existing warning/info debt is reported without blocking the build.
        # New warnings should be removed as part of the corresponding change.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Diagnose notification panel geometry
        run: flutter test --platform chrome --reporter expanded test/feature/notification/notification_bell_test.dart

      - name: Run tests
        # Web coverage collection is not supported reliably by the current Flutter toolchain.
        # The github reporter turns failing tests into PR annotations.
        run: flutter test --platform chrome --reporter github

      - name: Build web
        run: flutter build web

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag webui-fe:${{ github.sha }} .
