name: WebUI_FE_CD
on:
  push:
    branches: ["main", "develope"]

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Github Repository
        uses: actions/checkout@v4

      - name: Copy project to Remote Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_ADDR }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PWD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./*"
          target: "/home/${{ secrets.SERVER_USERNAME }}/workspace/dockers/WebUI_FE/service"
          rm: true

      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
          ROUTE_URI: ${{ secrets.ROUTE_URI }}
          BACKEND_URI: ${{ secrets.BACKEND_URI }}
        with:
          host: ${{ secrets.SERVER_ADDR }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PWD }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          command_timeout: 30m
          envs: CLIENT_ID,REDIRECT_URI,ROUTE_URI,BACKEND_URI
          script: |
            set -euo pipefail
            cd /home/${{ secrets.SERVER_USERNAME }}/workspace/dockers/WebUI_FE/service
            docker compose -p webui-fe down
            docker compose -p webui-fe up -d --build
            docker compose -p webui-fe ps
